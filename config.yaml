# ════════════════════════════════════════════════════════════════════════
#  MatchACell — configuration
#  Brewed with MatchACell · matcha-grade single-cell consensus
# ════════════════════════════════════════════════════════════════════════

# Main output directory. A results/ subfolder is created underneath; a trailing
# slash is optional (it is normalized in the Snakefile).
output_dir: "/Users/chiaraparrillo/Desktop/Progetti/MatchACell/output"

# Format of the files listed under `samples` below.
#   "h5ad" -> native, staged into results/{sample}/h5/ unchanged.
#   "rds"  -> a Seurat/SingleCellExperiment .rds, converted to .h5ad via
#             workflow/scripts/rds2h5.R before staging.
dtype: "h5ad"

# Data type
type: "singlecell"

# ── Samples ───────────────────────────────────────────────────────────────
#   key   = sample ID used in output paths and report titles.
#   value = path to the input .h5ad (raw-ish, post-segmentation counts),
#           absolute or relative to the working directory.
samples:
  pbmc3k: "data/pbmc3k.h5ad"

# ── Step 1: Leiden cluster-stability optimizer ────────────────────────────
matchacell_cluster_stability:
  # auto -> GPU if rapids-singlecell is importable, else CPU scanpy.
  backend: "auto"

  # Bootstrap iterations per resolution (higher = smoother Jaccard estimates).
  n_iter: 1000

  # Extra CLI flags passed verbatim to matchacell_cluster_stability.py.
  # See `docs/cli-and-outputs.md` for the full flag reference. Examples:
  #   "--resolutions 0.2 0.5 1.0 2.0 --skip-tsne"
  #   "--gpu-cell-threshold 50000 --rmm-pool-fraction 0.6"
  #   "--seed 0 --n-pcs 50 --n-neighbors 15"
  extra: ""

# ── Step 2: Cell Type Annotation ──────────────────────────────────────────

matchacell_annotation:

  #annotation file
  annot_file: "/Users/chiaraparrillo/Downloads/signature2.xlsx"

  #### Signature Methods:
  # --> ScoreGenes
  score_genes:
    threshold: 0.1
  
  # --> CIA
  cia:
    ncpus: 5
    threshold: 70

  # --> AddModuleScore (Seurat, R)
  addmodulescore:
    threshold: 0.1
  
  #### Dataset-based Methods:
  # --> Celltypist
  celltypist:
    models: ['Immune_All_Low.pkl', 'Immune_All_High.pkl']

  # --> scANVI (scvi-tools reference mapping)
  scanvi:
    # Path to an annotated reference AnnData (.h5ad) used to train the
    # scVI/SCANVI model. Leave empty to skip the scanvi rule entirely (e.g.
    # no suitable reference atlas for this tissue/species yet).
    # NOTE: the Tabula Muris Senis Brain_Non-Myeloid reference downloaded for
    # testing is MOUSE -- do not point this pbmc3k (human) config at it, same
    # species mismatch that broke celltypist on the human Immune_All_*
    # models against GSE255953's mouse panel. See config.gse255953.yaml for
    # the scanvi test wired to that (mouse) dataset instead.
    reference_file: ""
    # Column in the reference .obs holding cell type labels.
    label_col: "free_annotation"
    unlabeled_category: "Unknown"
    # Minimum prediction probability to keep a label (below -> Unknown).
    threshold: 0.7
    max_epochs_ref: 20
    max_epochs_scanvi: 20
    max_epochs_query: 10
    batch_size: 2048
    n_threads: 10

  # --> scParadise (pretrained or custom scAdam v2 model)
  scparadise:
    # Download a tissue/species-appropriate model first; see docs/scparadise.md.
    # Folder must end in scAdam and contain model_v2.pth.
    # Leave empty to skip this annotator.
    model_dir: ""
    # Step 1 stores log-normalized expression here. Empty string uses .X.
    layer: "lognorm"
    # 0 selects the finest available annotation level; 1, 2, ... select explicitly.
    label_level: 0
    # Minimum probability for cell_type_pred (below -> Unknown); 0 disables.
    threshold: 0.0
    detect_unknown: false
    unknown_method: "voting"
    # scAdam's Ashman separation threshold, not a prediction probability.
    unknown_threshold: 2.0
    batch_size: 256
    device: "auto"              # auto | cpu | cuda
    n_threads: 8
    seed: 0

  #### AI model-based Methods:
  # --> CyteType
  cytetype:
    # CyteType API bearer token. Keep this EMPTY here (config.yaml is
    # committed to git) and set it via the CYTETYPE_API_TOKEN env var instead,
    # e.g. `export CYTETYPE_API_TOKEN=cyt_...` before running ./run.py.
    # Leave both unset to skip the cytetype rule entirely (e.g. no account
    # yet, or `cytetype setup` credentials not available on this machine).
    # Get a token from https://cytetype.nygen.io after signing up.
    api_token: ""
    study_context: "Human PBMC scRNA-seq data (10x Genomics), used to validate the MatchACell annotation pipeline."
    title: "MatchACell run"
    run_label: "v1"
    n_top_genes: 100
