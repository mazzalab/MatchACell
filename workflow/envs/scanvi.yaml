# Per-rule conda environment used by the Snakemake `conda:` directive.
# Mirrors the top-level environment.yml so `--use-conda` runs are reproducible.
# Snakemake itself is provided by the launching environment, so it is omitted here.
name: matchacell-rule
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - scanpy>=1.9
  - anndata>=0.9
  - numpy
  - pandas
  - scipy
  - matplotlib-base
  - seaborn
  - plotly
  - openpyxl
  # scvi-tools pulls jax/jaxlib/pytorch as pip dependencies if left to pip
  # itself -- on Apple Silicon that resolved x86_64 wheels (jaxlib has no
  # arm64 build on PyPI for some versions) even inside an otherwise-native
  # env, crashing with "This version of jaxlib was built using AVX
  # instructions... do not support" on import. Pin them here as conda-forge
  # packages instead (real arm64 builds), so pip finds them already
  # satisfied and never reaches for its own wheels.
  - jax
  - jaxlib
  - pytorch
  - pip
  - pip:
      - scvi-tools
