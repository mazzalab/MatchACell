# Per-rule conda environment used by the Snakemake `conda:` directive.
# Mirrors the top-level environment.yml so `--use-conda` runs are reproducible.
# Snakemake itself is provided by the launching environment, so it is omitted here.
name: matchacell-rule
channels:
  - conda-forge
  - bioconda
dependencies:
  # celltypeai requires python>=3.12 (unlike most other rule envs, pinned 3.10).
  - python=3.12
  - scanpy>=1.9
  - anndata>=0.9
  - numpy
  - pandas
  - scipy
  - matplotlib-base
  - seaborn
  - plotly
  - openpyxl
  # CellTypeAI drives a local Ollama server (no cloud API key needed) --
  # pull the `ollama` binary from conda-forge so `ollama serve` / `ollama pull`
  # are available inside the rule env, then let pip install the package and
  # its python client.
  - ollama
  - pip
  - pip:
      - celltypeai
